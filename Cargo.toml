[package]
name = "ekspointer"
version = "0.1.0"
edition = "2021"
description = "Mise en évidence du pointeur et annotations éphémères à l'écran"
authors = ["Eksplodo"]
publish = false

[lib]
name = "ekspointer"
path = "src/lib.rs"

[[bin]]
name = "ekspointer"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
